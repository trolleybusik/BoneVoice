name: Build BoneVoice EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy sounddevice soundfile pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --name BoneVoice --add-data "samples;samples" bone_voice.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BoneVoice-Windows
          path: dist/BoneVoice/
